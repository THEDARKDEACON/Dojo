[develop]
script_dir=$base/lib/robot_perception

[install]
install_scripts=$base/lib/robot_perception

[easy_install]
# Prevent installation of dependencies from PyPI
allow_hosts = ''

[build_sphinx]
project = robot_perception
version = 0.1.0
release = 0.1.0
source-dir = doc/source
build-dir = build/sphinx
all_files = 1

[upload_sphinx]
upload-dir = build/sphinx/html
