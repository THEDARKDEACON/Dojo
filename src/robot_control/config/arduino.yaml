arduino_bridge:
  ros__parameters:
    baud_rate: 115200
    debug: true
    encoder_ticks_per_rev: 20
    end_delimiter: '>'
    field_separator: ','
    max_angular_speed: 1.0
    max_speed: 0.5
    motor_max: 255
    motor_min: 0
    pid:
      kd: 12.0
      ki: 0.0
      ko: 50
      kp: 20.0
      sample_time: 0.1
    port: /dev/ttyACM0
    start_delimiter: <
    timeout: 1.0
    wheel_base: 0.26
    wheel_circumference: 0.207
    wheel_radius: 0.033
    write_timeout: 1.0
