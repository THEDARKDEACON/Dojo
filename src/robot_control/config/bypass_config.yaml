# Bypass Mode Configuration
# Purpose: Configuration for Arduino Integration Bypass Mode with robosync-compatible parameters
# Used by: Bypass controller, direct Arduino driver, and configuration override components
# Package: robot_control

# Bypass Controller Configuration
bypass_controller:
  ros__parameters:
    # Mode management
    bypass_active: false
    emergency_stop_active: false
    
    # Command velocity processing
    cmd_vel_timeout: 1.0          # Timeout for cmd_vel messages (seconds)
    max_linear_velocity: 0.5      # Maximum linear velocity (m/s)
    max_angular_velocity: 1.0     # Maximum angular velocity (rad/s)
    
    # Status publishing
    status_publish_rate: 10.0     # Hz
    
    # Safety settings
    preserve_emergency_stop: true
    allow_mode_switching: true

# Direct Arduino Driver Configuration
direct_arduino_driver:
  ros__parameters:
    # Serial communication settings (robosync-compatible)
    baud_rate: 115200
    port: "/dev/ttyACM0"
    timeout: 1.0
    write_timeout: 1.0
    
    # Connection management
    auto_reconnect: true
    reconnect_interval: 5.0       # seconds
    max_reconnect_attempts: 10
    
    # ROSArduinoBridge protocol settings
    use_rosarduino_protocol: true
    command_delimiter: "\r"
    response_timeout: 0.5
    max_retries: 3
    
    # Odometry publishing
    odom_publish_rate: 20.0       # Hz (matching robosync)
    odom_frame_id: "odom"
    base_frame_id: "base_link"
    
    # Debug settings
    debug_commands: false
    log_raw_responses: false

# Physical Parameters (robosync-compatible values)
physical_parameters:
  ros__parameters:
    # Robot dimensions (robosync values)
    wheel_base: 0.19              # meters (robosync value)
    wheel_radius: 0.035           # meters (robosync value)
    wheel_circumference: 0.2199   # 2 * pi * wheel_radius
    
    # Encoder settings (robosync values)
    encoder_ticks_per_rev: 20     # robosync value
    encoder_resolution: 20        # same as ticks_per_rev
    
    # Motor settings
    motor_max: 255
    motor_min: 0
    max_motor_speed: 255
    min_motor_speed: 50

# PID Parameters (robosync values)
pid_parameters:
  ros__parameters:
    kp: 20.0                      # robosync PID values
    kd: 12.0
    ki: 0.0
    ko: 50
    sample_time: 0.1

# Configuration Override Settings
configuration_override:
  ros__parameters:
    # Override mode
    override_active: false
    backup_original_params: true
    
    # Parameters to override for robosync compatibility
    override_wheel_base: true
    override_wheel_radius: true
    override_encoder_ticks: true
    override_pid_parameters: true
    override_communication_settings: true
    
    # Fallback behavior
    use_fallback_on_error: true
    restore_on_shutdown: true

# Safety Override Manager Settings
safety_override_manager:
  ros__parameters:
    # Bypass mode settings
    bypass_mode_active: false
    preserve_emergency_stop: true
    
    # Safety systems to disable in bypass mode
    disable_emergency_stop_handler: true
    disable_safety_supervisor: true
    disable_hardware_discovery_timeouts: true
    disable_sensor_dependency_checks: true
    
    # Safety systems to keep active
    keep_emergency_stop_button: true
    keep_manual_override: true
    
    # Re-enabling settings
    enable_graceful_restoration: true
    restoration_timeout: 10.0     # seconds

# Diagnostic and Monitoring Settings
diagnostics:
  ros__parameters:
    # Status monitoring
    publish_bypass_status: true
    publish_arduino_diagnostics: true
    publish_safety_status: true
    
    # Performance monitoring
    monitor_command_latency: true
    monitor_communication_health: true
    monitor_system_resources: false
    
    # Error reporting
    detailed_error_messages: true
    log_communication_errors: true
    error_history_size: 100

# Launch Configuration
launch_config:
  # Components to include in bypass mode
  include_bypass_controller: true
  include_direct_arduino_driver: true
  include_configuration_override: true
  include_safety_override_manager: true
  include_robot_state_publisher: true
  include_static_transforms: true
  
  # Components to exclude in bypass mode
  exclude_emergency_stop_handler: true
  exclude_safety_supervisor: true
  exclude_hardware_manager: true
  exclude_camera_drivers: true
  exclude_lidar_drivers: true
  exclude_complex_control_managers: true
  exclude_hardware_discovery: true