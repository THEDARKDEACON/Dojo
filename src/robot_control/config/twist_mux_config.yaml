# Twist Mux Configuration

/**:
  ros__parameters:
    # The output topic where twist commands are published
    topic_out: /cmd_vel_out
    
    # Use stamped twist messages
    use_stamped: false

    # Velocity Limits - Reduced for smoother control
    # These limits apply to all input topics unless overridden
    linear:
      x:
        has_velocity_limits: true
        max_velocity: 0.3
        min_velocity: -0.3
        has_acceleration_limits: true
        max_acceleration: 0.5
        min_acceleration: -0.5
    angular:
      z:
        has_velocity_limits: true
        max_velocity: 0.6
        min_velocity: -0.6
        has_acceleration_limits: true
        max_acceleration: 0.8
        min_acceleration: -0.8

    # Input Topic Configuration
    topics:
      # Navigation stack input (lowest priority)
      navigation:
        topic: /cmd_vel_nav
        timeout: 1.0
        priority: 10
        # Optional: Override global velocity limits
        # linear:
        #   x: {max_velocity: 0.3, min_velocity: -0.3}
        # angular:
        #   z: {max_velocity: 0.5, min_velocity: -0.5}

      # Autonomous mapping controller (medium-low priority)
      autonomous_mapping:
        topic: /cmd_vel_autonomous
        timeout: 2.0
        priority: 50

      # Teleoperation input (medium priority)
      teleop:
        topic: /cmd_vel_teleop
        timeout: 1.0
        priority: 100
        # Optional: Override global velocity limits
        # linear:
        #   x: {max_velocity: 0.3, min_velocity: -0.3}
        # angular:
        #   z: {max_velocity: 0.5, min_velocity: -0.5}

      # Safety controller input (highest priority)
      safety:
        topic: /cmd_vel_safety
        timeout: 0.5
        priority: 200
        # Optional: Override global velocity limits
        # linear:
        #   x: {max_velocity: 0.1, min_velocity: -0.1}
        # angular:
        #   z: {max_velocity: 0.2, min_velocity: -0.2}