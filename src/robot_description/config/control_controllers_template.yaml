# Robot Controllers Configuration (Reference/Template)
# This file serves as a reference template for controller configurations
# The active controller configuration is in robot_gazebo/config/ros2_controllers.yaml
# This file is maintained for documentation and as a template for hardware deployments

controller_manager:
  ros__parameters:
    update_rate: 100  # Hz
    
    # Controller names
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    
    # Diff Drive Controller
    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController
      left_wheel_names: ["left_wheel_joint"]
      right_wheel_names: ["right_wheel_joint"]
      wheel_separation: 0.26  # meters
      wheel_radius: 0.06     # meters
      wheel_separation_multiplier: 1.0
      left_wheel_radius_multiplier: 1.0
      right_wheel_radius_multiplier: 1.0
      
      # PID parameters
      wheel_radius_multiplier: 1.0
      publish_rate: 50.0
      odom_frame_id: odom
      base_frame_id: base_link
      pose_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.03]
      twist_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.03]
      
      # Velocity and acceleration limits
      linear.x.max_velocity: 0.5  # m/s
      linear.x.min_velocity: -0.5  # m/s
      linear.x.max_acceleration: 3.0  # m/s^2
      linear.x.min_acceleration: -3.0  # m/s^2
      
      # Open loop control (set to false for closed loop)
      open_loop: true
      
      # Enable/disable broadcast of TF odom->base_link
      enable_odom_tf: true
      
      # Command queue size
      cmd_vel_timeout: 0.5  # seconds
