controller_manager:
  ros__parameters:
    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    robot_description: robot_description
    robot_description_joint_limits: ''
    robot_description_kinematics: ''
    robot_description_kinematics_cache: ''
    robot_description_planning: ''
    robot_description_planning_cartesian_limits: ''
    robot_description_planning_joint_limits: ''
    robot_description_semantic: ''
    update_rate: 50
    use_sim_time: true
diff_drive_controller:
  ros__parameters:
    angular:
      z:
        has_acceleration_limits: true
        has_jerk_limits: false
        has_velocity_limits: true
        max_acceleration: 3.0
        max_velocity: 1.0
        min_acceleration: -3.0
        min_velocity: -1.0
    base_frame_id: base_link
    cmd_vel_timeout: 1.0
    enable_odom_tf: true
    left_wheel_names:
    - left_wheel_joint
    left_wheel_radius_multiplier: 1.0
    linear:
      x:
        has_acceleration_limits: true
        has_jerk_limits: false
        has_velocity_limits: true
        max_acceleration: 3.0
        max_velocity: 0.5
        min_acceleration: -3.0
        min_velocity: -0.5
    odom_frame_id: odom
    open_loop: true
    pose_covariance_diagonal:
    - 0.001
    - 0.001
    - 0.001
    - 0.001
    - 0.001
    - 0.03
    publish_odom: true
    publish_odom_tf: true
    publish_rate: 50
    right_wheel_names:
    - right_wheel_joint
    right_wheel_radius_multiplier: 1.0
    twist_covariance_diagonal:
    - 0.001
    - 0.001
    - 0.001
    - 0.001
    - 0.001
    - 0.03
    wheel_radius: 0.033
    wheel_separation: 0.26
    wheel_separation_multiplier: 1.0
hardware_interface:
  ros__parameters:
    control_period: 0.01
    gazebo:
      control_mode: velocity
      max_effort: 0.1
      robot_param: robot_description
      robot_sim_type: gazebo_ros2_control/GazeboSystem
    hardware_plugin: gazebo_ros2_control/GazeboSystem
    use_sim_time: true
joint_state_broadcaster:
  ros__parameters:
    joints:
    - front_left_wheel_joint
    - front_right_wheel_joint
    - rear_left_wheel_joint
    - rear_right_wheel_joint
