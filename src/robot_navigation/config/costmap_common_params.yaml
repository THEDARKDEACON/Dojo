/**:
  ros__parameters:
    # Global costmap parameters
    use_sim_time: False
    
    # Common costmap parameters
    robot_radius: 0.22  # Radius of the robot in meters
    resolution: 0.05    # Resolution of the costmap in meters/cell
    track_unknown_space: true
    lethal_cost_threshold: 253
    unknown_cost_value: 255
    trinary_costmap: true
    transform_tolerance: 0.2
    map_update_frequency: 5.0  # Hz
    publish_frequency: 2.0     # Hz
    global_frame: map
    robot_base_frame: base_footprint
    update_frequency: 5.0  # Hz
    static_map: true
    rolling_window: false
    width: 10.0  # meters
    height: 10.0  # meters
    origin_x: -5.0  # meters
    origin_y: -5.0  # meters
    
    # Inflation parameters
    inflation_radius: 0.55  # meters
    cost_scaling_factor: 10.0
    
    # Obstacle layer - for laser/pointcloud obstacles
    obstacle_layer:
      enabled: true
      max_obstacle_height: 2.0  # meters
      min_obstacle_height: 0.0  # meters
      obstacle_range: 2.5  # meters
      raytrace_range: 3.0  # meters
      observation_sources: scan
      scan: {sensor_frame: base_scan, data_type: LaserScan, topic: /scan, marking: true, clearing: true}
      track_unknown_space: true
      combination_method: 1  # Overwrite (0), Maximum (1), or Override (2)
      obstacle_plugin: "voxel_layer"
      
    # Static layer - for the static map
    static_layer:
      enabled: true
      map_topic: map
      subscribe_to_updates: true
      track_unknown_space: true
      use_maximum: false
      trinary_map: true
      unknown_cost_value: -1
      
    # Inflation layer - for inflating obstacles
    inflation_layer:
      enabled: true
      cost_scaling_factor: 10.0  # Exponential rate at which the obstacle cost drops off
      inflation_radius: 0.55  # meters - should be at least the robot radius + safety margin
      
    # Voxel layer - for 3D obstacle representation
    voxel_layer:
      enabled: true
      publish_voxel_map: false
      origin_z: 0.0  # meters
      z_resolution: 0.2  # meters
      z_voxels: 10
      max_obstacle_height: 2.0  # meters
      mark_threshold: 0
      update_footprint_enabled: true
      combination_method: 1  # Overwrite (0), Maximum (1), or Override (2)
      
    # Footprint clearing - for clearing space around the robot
    footprint_clearing_enabled: true
    footprint_padding: 0.1  # meters
    
    # Observation buffering
    observation_sources: scan
    scan: {sensor_frame: base_scan, data_type: LaserScan, topic: /scan, marking: true, clearing: true}
    
    # Map update parameters
    update_footprint_enabled: true
    always_send_full_costmap: false
    
    # Plugin settings
    plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
