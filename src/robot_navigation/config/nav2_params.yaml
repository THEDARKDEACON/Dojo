/**:
  ros__parameters:
    # Global parameters
    use_sim_time: False
    autostart: True
    bt_xml_filename: "navigate_w_replanning_and_recovery.xml"
    global_frame: map
    robot_base_frame: base_footprint
    odom_frame: odom
    map_topic: map
    robot_radius: 0.22
    transform_tolerance: 0.2
    
    # Recovery behavior
    recovery_plugins: ["clear_costmap_recovery", "spin_recovery", "wait_recovery"]
    clear_costmap_recovery:
      reset_distance: 3.0
    spin_recovery:
      spin_angle: 1.57  # 90 degrees in radians
      time_allowance: 10.0
    wait_recovery:
      wait_duration: 5.0
    
    # Planner Server
    planner_server:
      ros__parameters:
        expected_planner_frequency: 20.0
        planner_plugins: ["GridBased", "SmacPlanner"]
        use_sim_time: False
        
        # NavFn Planner
        GridBased:
          plugin: "nav2_navfn_planner/NavfnPlanner"
          use_final_approach_orientation: false
          tolerance: 0.5
          use_astar: false
          allow_unknown: true
          allow_unknown_intermediate: true
          use_grid_path: false
          max_iterations: 1000000
          max_planning_time: 5.0
          
        # Smac Planner (for smoother paths)
        SmacPlanner:
          plugin: "nav2_smac_planner/SmacPlanner"
          tolerance: 0.5
          allow_unknown: true
          max_iterations: 1000000
          max_planning_time: 5.0
          smooth_path: true
          motion_model_for_search: "DUBIN"  # DUBIN, REEDS_SHEPP, 2D, etc.
          minimum_turning_radius: 0.2
    
    # Controller Server  
    controller_server:
      ros__parameters:
        controller_frequency: 20.0
        min_x_velocity_threshold: 0.001
        min_y_velocity_threshold: 0.5
        min_theta_velocity_threshold: 0.001
        failure_tolerance: 0.3
        progress_checker_plugin: "progress_checker"
        goal_checker_plugins: ["general_goal_checker", "precise_goal_checker"]
        controller_plugins: ["FollowPath"]
        
        # Progress checker
        progress_checker:
          plugin: "nav2_controller::SimpleProgressChecker"
          required_movement_radius: 0.5
          movement_time_allowance: 10.0
          
        # Goal checkers
        general_goal_checker:
          plugin: "nav2_controller::SimpleGoalChecker"
          xy_goal_tolerance: 0.25
          yaw_goal_tolerance: 0.25
          stateful: True
          
        precise_goal_checker:
          plugin: "nav2_controller::SimpleGoalChecker"
          xy_goal_tolerance: 0.1
          yaw_goal_tolerance: 0.1
          stateful: True
        
        # DWB Controller
        FollowPath:
          plugin: "dwb_core::DWBLocalPlanner"
          debug_trajectory_details: True
          
          # Robot velocity limits
          min_vel_x: 0.0
          min_vel_y: 0.0
          max_vel_x: 0.26
          max_vel_y: 0.0
          max_vel_theta: 1.0
          min_speed_xy: 0.0
          max_speed_xy: 0.26
          min_speed_theta: 0.0
          
          # Acceleration limits
          acc_lim_x: 2.5
          acc_lim_y: 0.0
          acc_lim_theta: 3.2
          decel_lim_x: -2.5
          decel_lim_y: 0.0
          decel_lim_theta: -3.2
          
          # Trajectory generation
          sim_time: 1.7
          vx_samples: 20
          vy_samples: 0
          vtheta_samples: 40
          
          # Goal distance bias
          path_distance_bias: 32.0
          goal_distance_bias: 20.0
          occdist_scale: 0.1
          
          # Forward simulation
          sim_granularity: 0.025
          angular_sim_granularity: 0.025
          
          # Oscillation prevention
          oscillation_reset_dist: 0.05
          oscillation_reset_angle: 0.2
          
          # Obstacle scoring
          max_vel_x: 0.26
          min_vel_x: 0.0
          max_vel_theta: 1.0
          min_vel_theta: -1.0
          min_in_place_vel_theta: 0.5
          
          # Cost function parameters
          path_distance_bias: 32.0
          goal_distance_bias: 20.0
          occdist_scale: 0.1
          forward_point_distance: 0.1
          
          # DWB-specific parameters
          prune_plan: True
          prune_distance: 1.0
          prune_plan_clear_distance: 0.5
          
          # Debugging
          publish_traj_pc: True
          publish_cost_grid_pc: False
          decel_lim_theta: -3.2
          vx_samples: 20
          vy_samples: 5
          vtheta_samples: 20
          sim_time: 1.7
          linear_granularity: 0.025
          angular_granularity: 0.025
          transform_tolerance: 0.2
          xy_goal_tolerance: 0.25
          trans_stopped_velocity: 0.25
          short_circuit_trajectory_evaluation: True
          stateful: True
          critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
          BaseObstacle.scale: 0.02
          PathAlign.scale: 0.5
          PathAlign.forward_point_distance: 0.1
          GoalAlign.scale: 0.5
          GoalAlign.forward_point_distance: 0.1
          PathDist.scale: 0.5
          GoalDist.scale: 0.5
          RotateToGoal.scale: 32.0
          RotateToGoal.slowing_factor: 5.0
          RotateToGoal.lookahead_time: -1.0
          
        # Progress Checker
        progress_checker:
          plugin: "nav2_controller::SimpleProgressChecker"
          required_movement_radius: 0.5
          movement_time_allowance: 10.0
          
        # Goal Checkers
        general_goal_checker:
          plugin: "nav2_controller::SimpleGoalChecker"
          xy_goal_tolerance: 0.25
          yaw_goal_tolerance: 0.25
          
        precise_goal_checker:
          plugin: "nav2_controller::SimpleGoalChecker"
          xy_goal_tolerance: 0.1
          yaw_goal_tolerance: 0.1
