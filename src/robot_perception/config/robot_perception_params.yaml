# Robot Perception Node Parameters (ROS2 Parameter Structure)
# This file provides ROS2-compatible parameter structure for perception nodes
# Used by perception.launch.py and individual perception nodes

/**:
  ros__parameters:
    use_sim_time: False
    debug_mode: False
    enable_visualization: True
    
    # Frame names
    base_frame: "base_footprint"
    camera_frame: "camera_link"
    lidar_frame: "laser"
    map_frame: "map"
    odom_frame: "odom"
    
    # Camera configuration
    camera_processor:
      ros__parameters:
        enabled: True
        camera_topic: "/camera/image_raw"
        camera_info_topic: "/camera/camera_info"
        compressed: True  # Whether to use compressed image transport
        queue_size: 10
        
        # Image processing
        resize_width: 640
        resize_height: 480
        publish_processed: True
        processed_topic: "/perception/processed_image"
        
        # Debug visualization
        debug: False
        debug_window_name: "Camera Feed"
        
        # Color detection (HSV ranges)
        color_detection:
          enabled: True
          min_object_size: 100
          max_objects: 10
          # Red color range
          red_lower_1: [0, 100, 100]
          red_upper_1: [10, 255, 255]
          red_lower_2: [160, 100, 100]
          red_upper_2: [180, 255, 255]
          # Green color range
          green_lower: [40, 40, 40]
          green_upper: [80, 255, 255]
          # Blue color range
          blue_lower: [90, 50, 50]
          blue_upper: [130, 255, 255]
    
    # LiDAR configuration
    lidar_processor:
      ros__parameters:
        enabled: True
        scan_topic: "/scan"
        pointcloud_topic: "/perception/points"
        queue_size: 10
        
        # Filter parameters
        min_range: 0.1  # meters
        max_range: 10.0  # meters
        angle_min: -3.14159  # -180 degrees in radians
        angle_max: 3.14159   # 180 degrees in radians
        
        # Clustering parameters
        cluster_tolerance: 0.2  # meters
        min_cluster_size: 3
        max_cluster_size: 100
        
        # Ground plane removal
        remove_ground: True
        ground_threshold: 0.1  # meters
        
        # Debug
        publish_markers: True
        marker_topic: "/perception/lidar_markers"
    
    # Object detection (YOLOv8)
    object_detector:
      ros__parameters:
        enabled: True
        model_path: "yolov8n.pt"  # Will be resolved relative to package share
        model_type: "yolov8"  # Options: yolov5, yolov8, etc.
        device: "cuda"  # "cuda" or "cpu"
        
        # Detection parameters
        confidence_threshold: 0.5
        nms_threshold: 0.4
        max_detections: 100
        
        # Input image size
        img_size: 640
        
        # Class names (COCO dataset by default)
        class_names: [
          "person", "bicycle", "car", "motorcycle", "airplane", "bus", "train", "truck", "boat",
          "traffic light", "fire hydrant", "stop sign", "parking meter", "bench", "bird", "cat",
          "dog", "horse", "sheep", "cow", "elephant", "bear", "zebra", "giraffe", "backpack",
          "umbrella", "handbag", "tie", "suitcase", "frisbee", "skis", "snowboard", "sports ball",
          "kite", "baseball bat", "baseball glove", "skateboard", "surfboard", "tennis racket",
          "bottle", "wine glass", "cup", "fork", "knife", "spoon", "bowl", "banana", "apple",
          "sandwich", "orange", "broccoli", "carrot", "hot dog", "pizza", "donut", "cake", "chair",
          "couch", "potted plant", "bed", "dining table", "toilet", "tv", "laptop", "mouse",
          "remote", "keyboard", "cell phone", "microwave", "oven", "toaster", "sink", "refrigerator",
          "book", "clock", "vase", "scissors", "teddy bear", "hair drier", "toothbrush"
        ]
        
        # Visualization
        publish_detections: True
        visualize: True
        debug: False
    
    # Depth estimation (if using stereo/RGB-D camera)
    depth_estimator:
      ros__parameters:
        enabled: False
        depth_topic: "/camera/depth/image_raw"
        camera_info_topic: "/camera/depth/camera_info"
        pointcloud_topic: "/perception/points"
        
        # Depth parameters
        min_depth: 0.1  # meters
        max_depth: 10.0  # meters
    
    # Visualization settings
    visualization:
      ros__parameters:
        enabled: True
        marker_lifetime: 0.1  # seconds
        
        # Detection visualization
        detection_colors:
          person: [1.0, 0.0, 0.0]  # Red
          car: [0.0, 0.0, 1.0]     # Blue
          dog: [0.0, 1.0, 0.0]      # Green
          default: [1.0, 1.0, 0.0]  # Yellow
        
        # Point cloud visualization
        point_size: 0.02
        
        # Image visualization
        show_image: True
        image_scale: 0.5
    
    # Performance settings
    performance:
      ros__parameters:
        use_threading: True
        max_update_rate: 30.0  # Hz
        queue_size: 10
