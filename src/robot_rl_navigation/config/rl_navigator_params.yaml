rl_navigator:
  ros__parameters:
    # Policy settings
    policy_path: "models/ppo_navigation_policy.zip"
    algorithm: "ppo"  # Options: "ppo", "sac"
    device: "auto"  # Options: "auto", "cpu", "cuda"
    
    # Confidence settings
    confidence_threshold: 0.7  # Minimum confidence to use RL policy
    fallback_to_nav2: true  # Enable Nav2 fallback when confidence low
    confidence_window_size: 10  # Moving average window for confidence
    
    # Performance settings
    update_rate: 10.0  # Hz - how often to compute actions
    action_smoothing: 0.3  # Exponential smoothing factor (0-1)
    observation_timeout: 1.0  # seconds - max age for observations
    
    # Safety settings
    max_linear_vel: 0.5  # m/s
    max_angular_vel: 1.0  # rad/s
    min_obstacle_distance: 0.3  # m - emergency stop distance
    safety_margin: 0.5  # m - preferred minimum distance
    
    # Observation processing
    lidar_points: 64  # Number of LiDAR points to use
    lidar_max_range: 10.0  # m - maximum LiDAR range
    normalize_observations: true  # Normalize obs to [-1, 1]
    
    # Goal settings
    goal_tolerance: 0.2  # m - distance to consider goal reached
    goal_timeout: 300.0  # seconds - max time to reach goal
    
    # Logging and debugging
    enable_logging: true
    log_level: "info"  # Options: "debug", "info", "warn", "error"
    publish_confidence: true
    publish_status: true
    visualize_policy: false  # Publish visualization markers
